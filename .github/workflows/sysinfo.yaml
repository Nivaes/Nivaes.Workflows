name: SyncInfo

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # Linux
  # ============================================================
  SyncInfo-Linux:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-slim

    runs-on: ${{ matrix.os }}

    steps:
      - name: System information
        shell: bash
        run: |
          echo "========================================"
          echo "RUNNER"
          echo "========================================"
          echo "Name:          $RUNNER_NAME"
          echo "OS:            $RUNNER_OS"
          echo "Architecture:  $RUNNER_ARCH"

          echo
          echo "=== CPU ==="
          nproc
          lscpu

          echo
          echo "=== MEMORY ==="
          free -h

          echo
          echo "=== DISK ==="
          df -h

          echo
          echo "=== DOCKER ==="
          docker info || true


  # ============================================================
  # Windows
  # ============================================================
  SyncInfo-Windows:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - windows-2025-vs2026
          - windows-11-arm
          - windows-11-vs2026-arm

    runs-on: ${{ matrix.os }}

    steps:
      - name: System information
        shell: bash
        run: |
          echo "========================================"
          echo "RUNNER"
          echo "========================================"
          echo "Name:          $RUNNER_NAME"
          echo "OS:            $RUNNER_OS"
          echo "Architecture:  $RUNNER_ARCH"

          echo
          echo "=== CPU ==="
          powershell.exe -NoProfile -Command \
            "Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors"

          echo
          echo "=== MEMORY ==="
          powershell.exe -NoProfile -Command \
            "\$os = Get-CimInstance Win32_OperatingSystem; [math]::Round(\$os.TotalVisibleMemorySize / 1MB, 2).ToString() + ' GB'"

          echo
          echo "=== DISK ==="
          powershell.exe -NoProfile -Command \
            "Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{N='FreeGB';E={[math]::Round(\$_.Free/1GB,2)}},@{N='UsedGB';E={[math]::Round(\$_.Used/1GB,2)}}"

          echo
          echo "=== DOCKER ==="
          docker info || true


  # ============================================================
  # macOS
  # ============================================================
  SyncInfo-MacOS:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - macos-26-intel
          - xcode-27

    runs-on: ${{ matrix.os }}

    steps:
      - name: System information
        shell: bash
        run: |
          echo "========================================"
          echo "RUNNER"
          echo "========================================"
          echo "Name:          $RUNNER_NAME"
          echo "OS:            $RUNNER_OS"
          echo "Architecture:  $RUNNER_ARCH"

          echo
          echo "=== CPU ==="
          echo "Logical CPUs:"
          sysctl -n hw.logicalcpu

          echo "Physical CPUs:"
          sysctl -n hw.physicalcpu

          echo "Total CPUs:"
          sysctl -n hw.ncpu

          echo
          echo "=== CPU MODEL ==="
          sysctl -n machdep.cpu.brand_string 2>/dev/null || \
            sysctl -n hw.model

          echo
          echo "=== MEMORY ==="
          memory=$(sysctl -n hw.memsize)
          awk "BEGIN {printf \"%.2f GB\n\", $memory/1024/1024/1024}"

          echo
          echo "=== MEMORY DETAILS ==="
          vm_stat

          echo
          echo "=== DISK ==="
          df -h

          echo
          echo "=== DOCKER ==="
          docker info || true